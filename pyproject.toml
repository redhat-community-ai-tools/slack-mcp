[project]
name = "slack-mcp"
version = "1.0.0"
description = "MCP server for Slack — bot-token or browser-session auth, with read-only mode"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx==0.28.1",
    "mcp==1.29.1",
]

[project.scripts]
slack-mcp = "slack_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["slack_mcp_server.py"]
