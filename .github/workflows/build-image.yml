name: Build Container Image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is not needed, but pin to the exact pushed SHA so a
          # re-run never checks out a different commit.
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify commit is still the tip of the default branch
        # Guards the 'latest' tag: a stale run (e.g. re-run after more commits
        # landed on main) must not publish 'latest' for an outdated commit.
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${REPO}/branches/${DEFAULT_BRANCH}" --jq .commit.sha)"
          if [ "$tip" != "$RUN_SHA" ]; then
            echo "::error::${RUN_SHA} is no longer the tip of ${DEFAULT_BRANCH} (now ${tip}); refusing to publish 'latest'."
            exit 1
          fi
          echo "${RUN_SHA} is the current tip of ${DEFAULT_BRANCH}; proceeding."

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
